    <form action="" method="post">

        <h2>Student Information</h2>

        <label for="form-name" class="form-label">First Name:</label> 
        <input type="text" name="username" id="form-name" placeholder="Joe*" class="textinput form-control">
 
         <label for="form-name" class="form-label">Last Name:</label> 
        <input type="text" name="username" id="form-name" placeholder="Dou*" class="textinput form-control">
 

        <label for="form-select">Birth Date:</label> 
        <input type="date" name="Birthday" placeholder="dd/mm/yyyy*" id="form-selectl"class="textinput form-control">

         <label for="gender">Gender:</label>

 <label for="grade level">Grade Level:</label>

<label for="form-email">Email:</label>

     <h2>Other Information</h2>


        <fieldset id="mode of learning" >
    
<label for="mode of learning"> Mode of Learning</label>

            </div>

            <div class="form-check">
                <label class="form-check-label" >
